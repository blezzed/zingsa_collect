# Placeholder only. Do not commit real values.
# Create the live Secret with: pwsh k8s/create-secret.ps1 -EnvFile .env
apiVersion: v1
kind: Secret
metadata:
  name: zingsa-env
  namespace: zingsa
type: Opaque
stringData:
  DJANGO_SECRET_KEY: change-me
  DJANGO_DB_NAME: zingsa_collect
  DJANGO_DB_USER: zingsa_collect
  DJANGO_DB_PASSWORD: change-me
  # MinIO root credentials. AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY must match these.
  MINIO_ROOT_USER: change-me
  MINIO_ROOT_PASSWORD: change-me
  AWS_ACCESS_KEY_ID: change-me
  AWS_SECRET_ACCESS_KEY: change-me
  # Owner bypass token. Keep this out of the ConfigMap.
  MAINTENANCE_OWNER_TOKEN: change-me
  # kubectl set env overrides this without an image rebuild.
  MAINTENANCE_MODE: "0"
---
# CloudNativePG basic-auth secret. create-secret.ps1 builds this from
# DJANGO_DB_PASSWORD. The username is the cluster owner, zingsa_collect.
# CNPG stores the Postgres superuser in postgis-superuser itself.
apiVersion: v1
kind: Secret
metadata:
  name: postgis-app
  namespace: zingsa
type: kubernetes.io/basic-auth
stringData:
  username: zingsa_collect
  password: change-me
