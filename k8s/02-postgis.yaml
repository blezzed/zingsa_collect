# One CloudNativePG instance on the single node, same shape as NSDI.
# Extra instances on one host add memory and disk use without surviving a node loss.
# The image is the one already cached in k3s containerd; this host cannot pull reliably.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgis
  namespace: zingsa
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgis:16
  imagePullPolicy: IfNotPresent
  affinity:
    enablePodAntiAffinity: false
    nodeSelector:
      kubernetes.io/hostname: "REPLACE_WITH_NODE_HOSTNAME"
  bootstrap:
    initdb:
      database: zingsa_collect
      owner: zingsa_collect
      secret:
        name: postgis-app
      # Runs in template1 before the application database is cloned from it.
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis
        - CREATE EXTENSION IF NOT EXISTS postgis_topology
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp"
        - CREATE EXTENSION IF NOT EXISTS pgcrypto
  storage:
    size: 20Gi
    storageClass: local-path
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: postgis-nodeport
            spec:
              type: NodePort
              ports:
                - name: postgres
                  port: 5432
                  targetPort: 5432
                  protocol: TCP
                  nodePort: 30433
