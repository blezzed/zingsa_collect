# Non-secret runtime config. Secrets live in the zingsa-env Secret.
# Keys here override the same keys in zingsa-env (envFrom order), so the Docker
# .env can be reused for the Secret without its 127.0.0.1 / compose values leaking in.
# Node addresses: 172.16.3.24 (LAN, node InternalIP), 41.174.184.62 (public),
# 172.30.5.24 (legacy LAN alias on the same host). Web NodePort is 30206.
# After editing, run scripts/apply-public-urls.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zingsa-app-config
  namespace: zingsa
data:
  IN_DOCKER: "1"
  DJANGO_DEBUG: "False"
  # NodePort is plain HTTP, so session and CSRF cookies must not be Secure.
  SESSION_COOKIE_SECURE: "False"
  CSRF_COOKIE_SECURE: "False"
  # CloudNativePG primary service. Writes and migrations use -rw.
  DJANGO_DB_HOST: "postgis-rw"
  DJANGO_DB_PORT: "5432"
  DJANGO_DB_NAME: "zingsa_collect"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"
  DJANGO_ALLOWED_HOSTS: "172.16.3.24,41.174.184.62,172.30.5.24,localhost,127.0.0.1"
  DJANGO_CSRF_TRUSTED_ORIGINS: "http://172.16.3.24:30206,http://41.174.184.62:30206,http://172.30.5.24:30206,http://localhost:30206,http://127.0.0.1:30206"
  # The Next.js export is served by this same web Service, so the frontend origin matches the API.
  FRONTEND_URL: "http://41.174.184.62:30206"
  SITE_URL: "http://41.174.184.62:30206"
  TIME_ZONE: "Africa/Harare"
  USE_S3: "True"
  AWS_S3_ENDPOINT_URL: "http://minio:9000"
  AWS_STORAGE_BUCKET_NAME: "zingsa-collect-media"
  # Browsers load media through the web port's /minio/ proxy, so no MinIO port
  # has to be reachable. Relative URLs work from both the LAN and public address.
  PUBLIC_MEDIA_RELATIVE: "True"
  AWS_S3_CUSTOM_DOMAIN: "41.174.184.62:30206/minio/zingsa-collect-media"
  MINIO_PROXY_UPSTREAM: "http://minio:9000"
